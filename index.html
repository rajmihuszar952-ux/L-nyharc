<title>Lényharc – gyűjtögetős kártyajáték</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#12222a;--panel:#1c3440;--line:#2e4f5e;--tx:#eef3ef;--mu:#9bb3ba;--gold:#e8b04a;--t:#e5603c;--v:#3f9bd6;--f:#6aa84f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coins{background:var(--panel);border:1px solid var(--gold);color:var(--gold);padding:5px 12px;border-radius:20px;font-weight:bold}
nav{display:flex;gap:6px;margin-bottom:10px}
nav button{flex:1;padding:10px 4px;background:var(--panel);color:var(--mu);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px}
nav button.on{background:var(--gold);color:#1b1608;border-color:var(--gold);font-weight:bold}
button{cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--gold);color:#1b1608;font:inherit;font-weight:bold;font-size:16px;margin-top:12px}
.btn:disabled{opacity:.4}
.btn.alt{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
.opp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit}
.opp .em{font-size:30px}
.opp small{display:block;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;background:var(--panel);border:2px solid var(--c);border-radius:12px;padding:8px 4px 6px;text-align:center;color:var(--tx);font:inherit;min-width:0}
.card.T{--c:var(--t)}.card.V{--c:var(--v)}.card.F{--c:var(--f)}
.card .e{line-height:1}.card .e svg{width:64px;height:64px;display:block;margin:0 auto}
.card .n{font-size:11px;margin:2px 0;line-height:1.15;min-height:25px;display:flex;align-items:center;justify-content:center}
.card .p{font-size:20px;font-weight:bold;color:var(--c)}
.card .el{font-size:11px;color:var(--mu)}
.card.R{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #b9c6cc}
.card.L{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold),0 0 14px var(--gold)}
.card.sel{transform:translateY(-4px);background:#27495a}
.card.off{opacity:.3}
.cnt{position:absolute;top:3px;right:5px;font-size:11px;color:var(--gold)}
.card.big{padding:16px 8px}.card.big .e svg{width:100px;height:100px}.card.big .n{font-size:15px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0}
.vs{font-weight:bold;color:var(--mu)}
.score{display:flex;justify-content:space-around;background:var(--panel);border-radius:12px;padding:8px;margin-bottom:6px}
.msg{background:var(--panel);border-radius:12px;padding:10px;text-align:center;margin:6px 0}
.win{color:#8fd16b}.lose{color:#ff8a70}.draw{color:var(--mu)}
.hint{color:var(--mu);font-size:13px}
.hide{display:none}
@keyframes br{50%{transform:scale(1.05)}}@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card .e svg{animation:br 3s ease-in-out infinite}}
.card.M{--c:#9fb3c2}.card.G{--c:var(--gold)}.st{color:var(--gold)}.opp.lock{opacity:.4}.opp:disabled{opacity:.45}.map{width:100%;height:auto;display:block;background:#173039;border-radius:14px}.map g:focus{outline:none}.map g:focus-visible circle{stroke:#e8b04a;stroke-width:5}.card.b1{--c:#cd7f32;background:linear-gradient(160deg,#4a3322,#241a12)}.card.b2{--c:#d5dde4;background:linear-gradient(160deg,#4a5762,#232c33)}.card.b3{--c:#ffd24a;background:linear-gradient(160deg,#5a4616,#2a210a);box-shadow:0 0 12px rgba(255,210,74,.6)}
.card.sel{outline:3px solid #fff;transform:translateY(-4px)}
.card .tr{margin:-8px -4px 4px;padding:2px 0;font-size:11px;font-weight:bold;letter-spacing:.1em;color:#1b1608;background:var(--c);border-radius:9px 9px 0 0}.card.big .tr{margin:-16px -8px 6px;font-size:13px;padding:3px 0}
.card .cnt{top:24px;color:#fff;background:#0008;border-radius:8px;padding:0 5px;z-index:1}
.card.no .e,.card.no .n,.card.no .p,.card.no .el,.card.no .tr{opacity:.4}.card.no .e svg{filter:grayscale(1)}
.nm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);background:#000b;border:1px solid #fff6;color:#fff;font-size:11px;font-weight:bold;padding:3px 8px;border-radius:8px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{padding:6px 10px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:inherit;font-size:13px}.chip.on{background:var(--gold);color:#1b1608;border-color:var(--gold)}
@media (prefers-reduced-motion:no-preference){
.card.hi.eT .e{position:relative}
.card.hi.eT .e::before,.card.hi.eT .e::after{content:'🔥';position:absolute;left:50%;bottom:35%;font-size:16px;opacity:0;pointer-events:none}
.card.hi.eT .e::before{animation:fl 1.4s ease-out infinite}
.card.hi.eT .e::after{font-size:13px;animation:fl2 1.4s ease-out .7s infinite}
@keyframes fl{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(30px,-36px) scale(1.3)}}
@keyframes fl2{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-30px,-36px) scale(1.3)}}
.card.hi.eF{animation:quake 1.6s linear infinite}
@keyframes quake{0%,32%,100%{transform:translate(0,0)}3%{transform:translate(-2px,1px) rotate(-.7deg)}7%{transform:translate(2px,-1px) rotate(.7deg)}11%{transform:translate(-2px,0)}15%{transform:translate(2px,1px) rotate(.5deg)}19%{transform:translate(-1px,-1px)}23%{transform:translate(1px,1px)}27%{transform:translate(-1px,0)}}
.card.hi.eV::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 7px,rgba(143,216,255,.55) 7px 8px);background-size:20px 20px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-6px 20px}}
}

.card.b4{--c:#6fe8ff;background:linear-gradient(160deg,#17586a,#0a2330);box-shadow:0 0 14px rgba(111,232,255,.75),inset 0 0 12px rgba(180,250,255,.25)}
.hd{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 2px}
@media (prefers-reduced-motion:no-preference){.card.b4::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}}
</style>
</head>

'<text x="'+p[0]+'" y="'+(p[1]+58)+'" text-anchor="middle" font-size="15" fill="#eef3ef">'+SN[s]+'</text>'+
'<text x="'+p[0]+'" y="'+(p[1]+75)+'" text-anchor="middle" font-size="13" fill="#9bb3ba">'+(dn?'✔ teljesítve':c+'/'+(stEnd(s)-s*4)+' legyőzve')+'</text></g>'+
'<text x="'+(p[0]<170?p[0]+66:p[0]-66)+'" y="'+(p[1]+10)+'" text-anchor="middle" font-size="30">'+DC[s]+'</text>'});
return '<h2>Válassz szintet</h2><svg class="map" viewBox="0 0 360 '+VH+'" role="group" aria-label="Szintek térképe"><path d="'+d+'" stroke="#4b7080" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round" fill="none"/>'+g+'</svg><p class="hint">Koppints egy szintre, hogy lásd az ellenfeleket.</p>'+rules()}
function stageView(){var s=B.s,h='<button class="btn alt" style="margin:0 0 6px" onclick="setTab(\'fight\')">← Térkép</button><h2>'+(s+1)+'. szint · '+SN[s]+'</h2>'+(s==2&&stOpen(2)?'<button class="btn alt" style="margin:0 0 8px" onclick="showIntro()">▶ Bevezető animáció újra</button>':'')+(stOpen(s)?'':'<div class="msg hint">🔒 Győzd le az előző szint mind a 4 ellenfelét egyszer, és megnyílik.</div>');
for(var i=s*4;i<stEnd(s);i++)h+=oppBtn(i);return h+rules()}
function fee(l){return l==0?Math.min(10,S.coins):10+5*l}function canPay(l){return l==0||S.coins>=fee(l)}function feeOf(i){return i==0?'max. 10 🪙':(10+5*i)+' 🪙'}
function stOpen(s){if(s==0)return true;for(var i=(s-1)*4;i<s*4;i++)if(S.beat.indexOf(i)<0)return false;return true}
function setTab(t){tab=t;V='list';shopCard=null;render()}
function render(){
document.getElementById('coins').textContent='🪙 '+S.coins;
var n=[['fight','Harc'],['coll','Gyűjtemény'],['shop','Bolt']];
document.getElementById('nav').innerHTML=n.map(function(x){return '<button class="'+(tab==x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
document.getElementById('app').innerHTML=tab=='fight'?fightView():tab=='coll'?collView():shopView();if(tab=='fight'&&V=='list')setTimeout(function(){try{var e=document.querySelector('[data-cur]');if(e)window.scrollTo(0,Math.max(0,e.getBoundingClientRect().top+window.scrollY-window.innerHeight/2))}catch(x){}},0)}
function rules(){return '<p class="hint">Harcban az elem dönt, bármilyen erős is a lap: 🔥 legyőzi a 🌿-t, a 🌿 a 💧-t és a 🔮-t, a 💧 a 🔥-t, a ⚙️ a 🔥-t, 💧-t és 🌿-t, a 🔮 varázs a ⚙️-t, 🔥-t és 💧-t. Azonos elemnél a nagyobb erő (10–100) nyer, egyenlő erőnél a magasabb szint (arany > ezüst > bronz), különben döntetlen. Az 1. szinten csak bronz lapokkal lehet harcolni, az ezüst, arany és gyémánt a 2. szinttől használható. A gyémánt lapok (100–150 erő) a Smaragd ládából nyílnak, a fém és varázs lényeknek nincs gyémánt változatuk.</p>'}
function oppBtn(i){var o=O[i],lock=!stOpen(stOf(i)),done=S.beat.indexOf(i)>=0;
return '<button class="opp'+(lock?' lock':'')+'"'+(lock||!canPay(i)?' disabled':' onclick="pick('+i+')"')+'><span class="em">'+o[1]+'</span><span><b>'+o[0]+(isBoss(i)?' · BOSS':'')+'</b>'+(done?' ✔':'')+'<small>'+o[2]+' · belépő: '+feeOf(i)+' · jutalom: +'+(10+15*i)+' 🪙'+(isBoss(i)?' + kártya'+(i==120&&!S.badge?' + jelvény':''):'')+'</small></span></button>'}
function fightView(){
if(V=='list')return mapView();if(V=='stage')return stageView();
if(V=='pick'){var ids=owned().sort(function(a,b){return pw(b)-pw(a)});
var ch=ids.map(function(k){return card(k,{sel:B.sel.indexOf(k)>=0,cnt:S.own[k],off:!allowed(k,B.l),fn:'tog('+k+')'})}).join('');
return '<h2>Válassz 3 kártyát ('+B.sel.length+'/3)</h2>'+(B.l<4?'<div class="msg hint">Az 1. szinten csak bronz lapokkal lehet harcolni. Az ezüst és arany lapok a 2. szinttől használhatók.</div>':'')+'<div class="grid">'+ch+'</div><button class="btn" '+(B.sel.length<3?'disabled':'')+' onclick="startFight()">Harc indul: '+O[B.l][0]+' ellen · belépő: '+fee(B.l)+' 🪙</button><button class="btn alt" onclick="openStage(B.s)">Vissza</button>'}
if(V=='fight'){
var hand=B.mine.map(function(m,k){return card(m.id,{off:m.used||!!B.res,fn:'play('+k+')'})}).join('');
var h='<div class="score"><span>Te: <b>'+B.w+'</b></span><span>Kör: '+Math.min(B.round+1,3)+'/3</span><span>'+O[B.l][1]+' <b>'+B.x+'</b></span></div>';
if(B.res){var r=B.res;h+='<div class="arena">'+card(r.m,{big:1})+'<div class="vs">VS</div>'+card(r.a,{big:1})+'</div><div class="msg '+r.out+'">'+r.txt+'</div><button class="btn" onclick="nextRound()">'+(B.round>=2?'Eredmény':'Következő kör')+'</button>'}
else h+='<div class="msg">Melyik kártyával harcolsz?</div>';
return h+'<h2>Kezed</h2><div class="grid">'+hand+'</div>'}
var e=B.end;return '<div class="msg"><div style="font-size:48px">'+e.ic+'</div><h2 class="'+e.cls+'">'+e.t+'</h2><p>'+B.w+' : '+B.x+' · '+(e.coins>0?'+':e.coins<0?'−':'±')+Math.abs(e.coins)+' 🪙</p></div>'+
(e.unlock?'<div class="msg win">🔓 Megnyílt a '+(stOf(B.l)+2)+'. szint!</div>':'')+
(e.card!==null?'<div class="msg">Új kártyát nyertél!</div><div style="max-width:160px;margin:0 auto">'+card(e.card,{big:1})+'</div>':'')+
'<button class="btn"'+(canPay(B.l)?'':' disabled')+' onclick="pick('+B.l+')">Visszavágó</button><button class="btn alt" onclick="openStage(B.s)">Másik ellenfél</button>'}
function pick(l){tab='fight';if(!canPay(l)){B={s:stOf(l)};V='stage';render();return}B={l:l,s:stOf(l),sel:[]};V='pick';render()}
function tog(k){if(!allowed(k,B.l))return;var i=B.sel.indexOf(k);
if(i>=0)B.sel.splice(i,1);else if(B.sel.length<3&&B.sel.filter(function(x){return x==k}).length<S.own[k])B.sel.push(k);render()}
var PERM=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function winp(ai,pl){var a=0,b=0;PERM.forEach(function(p){PERM.forEach(function(q){var w=0,x=0;for(var i=0;i<3;i++){var r=rr(pl[p[i]],ai[q[i]]);if(r>0)w++;else if(r<0)x++}if(x>w)a++;else if(x<w)b++})});return a+b?a/(a+b):.5}
function aiDeck(o,pl){var pool=[];C.forEach(function(c,i){if(o[3].indexOf(c[4])>=0)o[4].forEach(function(l){if(l<4||hasD(i))pool.push(i*4+l-1)})});
function one(){var q=pool.slice(),out=[];while(out.length<3&&q.length)out.push(q.splice(Math.floor(Math.random()*q.length),1)[0]);return out}
var best=null,bd=9;for(var t=0;t<60;t++){var d=one();if(pl&&pl.length==3&&d.length==3){var s=Math.abs(winp(d,pl)-(B.l<4?.4:.45));if(s<bd){bd=s;best=d}}}
return best||one()}
function startFight(){if(!canPay(B.l))return;B.fee=fee(B.l);S.coins-=B.fee;save();B.mine=B.sel.map(function(k){return {id:k,used:false}});
B.ai=aiDeck(O[B.l],B.sel).map(function(k){return {id:k,used:false}});B.round=0;B.w=0;B.x=0;B.res=null;V='fight';render()}
function rr(m,a){var x=mult(m,a),y=mult(a,m);if(x>1&&y<=1)return 1;if(y>1&&x<=1)return -1;var p=pw(m),q=pw(a);if(p!=q)return p>q?1:-1;if(lv(m)!=lv(a))return lv(m)>lv(a)?1:-1;return 0}
function play(k){if(B.res||B.mine[k].used)return;
var left=[],m=B.mine[k].id,l=B.l;B.ai.forEach(function(a,i){if(!a.used)left.push(i)});
var ai=rnd(left);
B.mine[k].used=true;B.ai[ai].used=true;
var a=B.ai[ai].id,pm=pw(m),pa=pw(a),r=rr(m,a),x=mult(m,a),y=mult(a,m),el=(x>1&&y<=1)||(y>1&&x<=1),out,txt,nums=' ('+pm+' : '+pa+')';
if(r>0){B.w++;out='win';txt=el?'Nyertél, az elem döntött!'+nums:pm!=pa?'Nyertél!'+nums:'Egyenlő erő ('+pm+'), de a magasabb szint döntött: nyertél!'}
else if(r<0){B.x++;out='lose';txt=el?'Veszítettél, az ellenfél eleme erősebb.'+nums:pm!=pa?'Veszítettél.'+nums:'Egyenlő erő ('+pm+'), de a magasabb szint döntött: veszítettél.'}
else{out='draw';txt='Döntetlen: mindkettő '+pm+' erős.'}
B.res={m:m,a:a,out:out,txt:txt};render()}
function nextRound(){B.res=null;B.round++;if(B.round>=3)finish();else render()}
function finish(){var l=B.l,e,st=stOf(l)+1,was=stOpen(st);
if(B.w>B.x){e={t:'Győzelem!',cls:'win',ic:'🏆',coins:10+15*l,card:isBoss(l)?roll(2):null};
if(S.beat.indexOf(l)<0)S.beat.push(l);e.unlock=st<30&&!was&&stOpen(st);if(l==120&&!S.badge){S.badge=1;e.badge=1}}
else if(B.w<B.x){e={t:'Vereség',cls:'lose',ic:'💥',coins:-B.fee,card:null}}
else{e={t:'Döntetlen',cls:'draw',ic:'🤝',coins:0,card:null}}
S.coins+=B.fee+e.coins;if(e.card!==null)add(e.card);save();B.end=e;V='end';render();if(e.badge)setTimeout(showBadge,700)}
function setCF(f){CF=CF==f?'':f;render()}
function collView(){var seen=0,tot=0,n={T:[0,0],V:[0,0],F:[0,0],M:[0,0],Z:[0,0]},r='';
C.forEach(function(c,i){var o=[0,1,2,3].some(function(l){return S.own[i*4+l]>0});if(o)seen++;c[2].split('').forEach(function(e){n[e][1]++;if(o)n[e][0]++})});
owned().forEach(function(k){tot+=S.own[k]});
C.forEach(function(c,i){if(CF&&c[2].indexOf(CF)<0)return;for(var l=0;l<(hasD(i)?4:3);l++){var id=i*4+l;if(l==3&&!S.own[id]&&!stOpen(5))continue;r+=card(id,S.own[id]>0?{cnt:S.own[id]}:{no:1})}});
var ch=['T','V','F','M','Z'].map(function(e){return '<button class="chip'+(CF==e?' on':'')+'" onclick="setCF(\''+e+'\')">'+E[e].i+' '+E[e].n+' '+n[e][0]+'/'+n[e][1]+'</button>'}).join('');
return '<h2>Lények: '+seen+'/'+C.length+' · kártyák: '+tot+'</h2><div class="chips">'+ch+'</div><p class="hint">Elemenként: megvan/összes lény. Koppints egy elemre a szűréshez.</p><div class="grid">'+r+'</div>'+(S.badge?'<button class="btn alt" onclick="showBadge()">🏅 Bajnoki jelvény megtekintése</button>':'')+rules()}
function shopView(){var h='<h2>Kártyacsomagok</h2>';
if(shopCard!==null)h+='<div style="max-width:160px;margin:10px auto">'+card(shopCard,{big:1})+'</div><div class="msg">'+(S.own[shopCard]>1?'Ez már megvolt, most '+S.own[shopCard]+' van belőle.':'Új kártya a gyűjteményben!')+'</div>';
PK.forEach(function(p,k){var lk=p.need&&!stOpen(p.need);h+='<button class="opp'+(lk?' lock':'')+'"'+(lk||S.coins<p.p?' disabled':'')+' onclick="buy('+k+')"><span class="em">'+p.em+'</span><span><b>'+p.n+' · '+p.p+' 🪙</b><small>'+(lk?'🔒 Az '+p.need+'. szint mind a 4 ellenfelének legyőzése után nyílik':p.d)+'</small></span></button>'});
return h+(S.coins<30?'<p class="hint">Nincs elég érméd. Nyerj harcokat!</p>':'')}
function buy(k){var p=PK[k];if(S.coins<p.p||(p.need&&!stOpen(p.need)))return;S.coins-=p.p;shopCard=roll(k);add(shopCard);save();render()}
render();

</script>
</body>
</html>
